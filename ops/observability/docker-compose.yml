services:
  prometheus:
    image: prom/prometheus:v3.14.0
    user: "${PERF_UID:-1000}:${PERF_GID:-1000}"
    container_name: luojia_soundscape_prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    user: "${PERF_UID:-1000}:${PERF_GID:-1000}"
    container_name: luojia_soundscape_grafana
    network_mode: host
    environment:
      # 3001 avoids conflicts with a locally installed API documentation service.
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请通过环境变量设置 Grafana 管理员密码}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    restart: unless-stopped
