global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: luojia-soundscape-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:8500
          - 127.0.0.1:8501
          - 127.0.0.1:8502
          - 127.0.0.1:8503
          - 127.0.0.1:8504
          - 127.0.0.1:8505
          - 127.0.0.1:8506
          - 127.0.0.1:8509
          - 127.0.0.1:8601
