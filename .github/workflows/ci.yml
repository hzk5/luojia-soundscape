name: Luojia Soundscape CI

on:
  push:
  pull_request:

jobs:
  build-and-unit-test:
    name: Build, security scan and focused tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile all modules
        run: mvn -B -DskipTests package
      - name: Scan repository and Git history for secrets
        run: bash scripts/security/scan-secrets.sh
      - name: Cache concurrency test
        run: mvn -B -pl common/service-util -am -DskipTests=false -Dtest=SoundscapeCacheAspectTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Batch query test
        run: mvn -B -pl service/service-user -am -DskipTests=false -Dtest=UserInfoServiceBatchTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Detail compatibility and ranking snapshot tests
        run: mvn -B -pl service/service-search -am -DskipTests=false -Dtest=ItemServiceImplTest,RankingSnapshotStoreTest,SearchCachePolicyTest -Dsurefire.failIfNoSpecifiedTests=false test
